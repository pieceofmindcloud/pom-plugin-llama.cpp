[workspace]
members = [
    "crates/llama-engine",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# O fork do llama.cpp (pieceofmindcloud) (branch pom) substitui o
# llama.cpp vendado na crates.io: o bindgen e o cmake leem o diretorio
# `llama.cpp` na raiz deste repositorio, via o symlink de
# `vendor/llama-cpp-sys-2/llama.cpp` (`../../llama.cpp`).
[patch.crates-io]
llama-cpp-sys-2 = { path = "vendor/llama-cpp-sys-2" }
