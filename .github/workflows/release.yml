name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar, com o prefixo v (ex.: v0.1.0). A tag é criada no commit escolhido no ramo.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch the llama.cpp fork at the locked commit
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source llama-cpp.lock
          git init -q llama.cpp
          git -C llama.cpp remote add origin "$LLAMA_CPP_REPOSITORY"
          git -C llama.cpp fetch --depth 1 origin "$LLAMA_CPP_COMMIT"
          git -C llama.cpp checkout -q FETCH_HEAD

      - name: Test llama-engine before publishing
        run: cargo test -p llama-engine

      - name: Package the source and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            tag="${INPUT_VERSION}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "versão inválida: $tag (use vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          # The engine is consumed as a git dependency pinned to a commit; the
          # release gives that commit a version name and the fork pin it was
          # tested with. No binary is attached: the fork's own releases carry them.
          git archive --format=tar.gz --prefix="pom-plugin-llama.cpp-${tag}/" \
            -o "pom-plugin-llama.cpp-${tag}.tar.gz" HEAD
          gh release create "$tag" "pom-plugin-llama.cpp-${tag}.tar.gz" llama-cpp.lock \
            --target "$GITHUB_SHA" --title "$tag" --generate-notes
