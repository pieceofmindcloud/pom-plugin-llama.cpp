name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not in the matrix yet: the POM's Windows build needs the
        # MSVC/libclang setup that its release workflow already documents.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch the llama.cpp fork at the locked commit
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source llama-cpp.lock
          git init -q llama.cpp
          git -C llama.cpp remote add origin "$LLAMA_CPP_REPOSITORY"
          git -C llama.cpp fetch --depth 1 origin "$LLAMA_CPP_COMMIT"
          git -C llama.cpp checkout -q FETCH_HEAD
          test -d llama.cpp/ggml

      - name: Test llama-engine
        run: cargo test -p llama-engine
